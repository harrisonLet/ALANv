<!doctype html>
<meta charset=utf-8>
<title>ALANv console</title>
<style>
    body {
        margin: 0;
        font: 13px system-ui;
        background: #111;
        color: #ddd;
        display: flex;
        flex-direction: column;
        height: 100vh
    }

    header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        padding: 8px;
        border-bottom: 1px solid #333
    }

    #tabs {
        display: flex;
        gap: 4px;
        padding: 8px 8px 0
    }

    main {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 8px
    }

    #logpane {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column
    }

    #stress {
        margin-top: 6px
    }

    #stress input[type=number] {
        width: 70px;
        background: #000;
        color: #ddd;
        border: 1px solid #444
    }

    #logpane[hidden] {
        display: none
    }

    #panes {
        overflow: auto
    }

    #log {
        flex: 1;
        overflow: auto;
        background: #000;
        padding: 6px;
        margin: 0;
        font: 12px monospace;
        white-space: pre-wrap
    }

    #cmd {
        margin-top: 6px;
        display: flex;
        gap: 6px
    }

    #cmd input {
        flex: 1;
        background: #000;
        color: #ddd;
        border: 1px solid #444;
        padding: 6px;
        font: 12px monospace
    }

    button {
        background: #333;
        color: #ddd;
        border: 1px solid #555;
        padding: 4px 10px;
        cursor: pointer
    }

    #tabs button.active {
        background: #2a5a8a
    }

    .cards {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 8px
    }

    .card {
        background: #1c1c1c;
        border: 1px solid #333;
        padding: 6px 10px;
        min-width: 150px
    }

    .card b {
        display: block;
        font: 20px monospace;
        color: #7fdc7f
    }

    .charts {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 8px
    }

    canvas {
        width: 100%;
        height: 160px;
        background: #000;
        border: 1px solid #333
    }

    textarea {
        width: 100%;
        height: 140px;
        background: #000;
        color: #ddd;
        font: 12px monospace
    }

    #err {
        color: #f66
    }
</style>
<header>
    <b>Show:</b>
    <span id=exts></span>
    <button id=reload title="Re-import extractor files">Reload</button>
    <span id=errs></span>
</header>
<div id=tabs></div>
<main>
    <div id=logpane>
        <pre id=log></pre>
        <form id=cmd><input id=in placeholder="command (Enter to send)" autocomplete=off><button>Send</button>
            <button type=button id=clr>Clear</button>
        </form>
        <div id=stress>
            <b>Stress test:</b>
            <input id=srate type=number value=100 min=0 title="commands per second, 0 = as fast as the port allows"> cmds/s
            <input id=sdur type=number value=10 min=1> s
            <label><input id=sbad type=checkbox> include bad input</label>
            <button id=sgo>Start</button> <button id=sstop>Stop</button> <span id=sstat></span>
        </div>
    </div>
    <div id=panes></div>
</main>
<script>
    const $ = id => document.getElementById(id);
    let logN = 0, seq = 0, nowT = 0, series = {}, stick = true;
    const log = $('log');
    log.onscroll = () => stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
    $('cmd').onsubmit = async e => {
        e.preventDefault(); const c = $('in').value; $('in').value = '';
        await fetch('/api/send', { method: 'POST', body: JSON.stringify({ cmd: c }) });
    };
    const stressPost = o => fetch('/api/stress', { method: 'POST', body: JSON.stringify(o) });
    $('sgo').onclick = () => stressPost({ action: 'start', rate: $('srate').value, duration: $('sdur').value, bad: $('sbad').checked });
    $('sstop').onclick = () => stressPost({ action: 'stop' });
    $('clr').onclick = () => { log.textContent = ''; };
    let exts = [], active = 'log';
    const panes = {}, tabBtns = {};
    async function loadExts() {
        const list = await (await fetch('/api/extractors')).json();
        exts = list;
        $('exts').replaceChildren(...list.map(e => {
            const l = document.createElement('label'); l.title = e.description; l.style.marginRight = '12px';
            const c = document.createElement('input'); c.type = 'checkbox'; c.checked = e.enabled; c.dataset.id = e.id;
            c.onchange = async () => {
                const ids = [...document.querySelectorAll('#exts input:checked')].map(i => i.dataset.id);
                await fetch('/api/extractors', { method: 'POST', body: JSON.stringify({ enabled: ids }) });
                loadExts();
            };
            l.append(c, ' ', e.short);
            return l;
        }));
        $('errs').replaceChildren(...list.filter(e => e.error).map(e => {
            const x = document.createElement('span'); x.id = 'err'; x.textContent = e.short + ': ' + e.error; return x;
        }));
        renderTabs();
    }
    function renderTabs() {
        const on = [{ id: 'log', name: 'Raw log' }, ...exts.filter(e => e.enabled)];
        if (!on.some(e => e.id === active)) active = 'log';
        $('tabs').replaceChildren(...on.map(e => {
            const b = document.createElement('button'); b.textContent = e.name;
            b.className = e.id === active ? 'active' : '';
            b.onclick = () => { active = e.id; renderTabs(); };
            return b;
        }));
        for (const id in panes) panes[id].hidden = id !== active;
        $('logpane').hidden = active !== 'log';
        $('panes').hidden = active === 'log';
        if (active === 'log') { if (stick) log.scrollTop = log.scrollHeight; } else drawAll(active);
    }
    $('reload').onclick = async () => { await fetch('/api/extractors/reload', { method: 'POST', body: '{}' }); loadExts(); };
    loadExts(); setInterval(loadExts, 5000);

    function pane(id) {
        if (!panes[id]) {
            const p = document.createElement('div'); p.hidden = id !== active;
            p.innerHTML = '<div class=cards></div><div class=charts></div>';
            $('panes').appendChild(p); panes[id] = p;
        }
        return panes[id];
    }
    const COLORS = ['#4af', '#fa4', '#7fdc7f', '#e7e', '#ee6'];
    function drawAll(id) {
        for (const k in series) if (series[k].ext === id) draw(series[k]);
    }
    function draw(s) {
        const ext = exts.find(e => e.id === s.ext), p = pane(s.ext), labels = Object.keys(s.traces);
        if (!s.card) {
            s.card = document.createElement('div'); s.card.className = 'card'; s.card.innerHTML = '<span></span><b></b>';
            p.querySelector('.cards').appendChild(s.card);
        }
        s.card.firstChild.textContent = s.name;
        s.card.lastChild.textContent = labels.map(l => {
            const v = s.traces[l].v; return (l ? l + ' ' : '') + v[v.length - 1];
        }).join(' / ') + (s.total != null ? ' / ' + s.total : '');
        if (!ext || ext.display !== 'graphs' || p.hidden) return;
        if (!s.canvas) { s.canvas = document.createElement('canvas'); p.querySelector('.charts').appendChild(s.canvas); }
        const c = s.canvas, w = c.width = c.clientWidth * 2, h = c.height = c.clientHeight * 2, x = c.getContext('2d');
        if (ext.window) for (const l of labels) { const tr = s.traces[l]; while (tr.t.length > 1 && tr.t[0] < nowT - ext.window) { tr.t.shift(); tr.v.shift(); } }
        const all = labels.flatMap(l => s.traces[l].v);
        let lo = Math.min(...all), hi = Math.max(...all); if (s.total != null) hi = Math.max(hi, s.total);
        if (ext.ymin != null) lo = ext.ymin; if (ext.ymax != null) hi = ext.ymax;
        if (lo == hi) { lo -= 1; hi += 1 }
        const first = labels[0], tEnd = s.traces[first].t;
        const t1 = ext.window ? Math.max(nowT, ext.window) : tEnd[tEnd.length - 1], t0 = ext.window ? t1 - ext.window : tEnd[0];
        const px = t => 40 + (w - 50) * (t - t0) / Math.max(t1 - t0, 1e-6), py = v => h - 24 - (h - 44) * (v - lo) / (hi - lo);
        x.font = '20px monospace'; x.fillStyle = '#aaa'; x.fillText(s.name, 44, 18); x.fillText(hi.toFixed(0), 0, 36); x.fillText(lo.toFixed(0), 0, h - 24);
        x.fillText(t1.toFixed(0) + 's', w - 70, h - 4);
        if (s.total != null) { x.strokeStyle = '#c44'; x.setLineDash([8, 6]); x.beginPath(); x.moveTo(40, py(s.total)); x.lineTo(w - 10, py(s.total)); x.stroke(); x.setLineDash([]) }
        labels.forEach((l, k) => {
            const tr = s.traces[l]; x.strokeStyle = x.fillStyle = COLORS[k % COLORS.length]; x.lineWidth = 2;
            x.beginPath(); tr.t.forEach((t, i) => i ? x.lineTo(px(t), py(tr.v[i])) : x.moveTo(px(t), py(tr.v[i]))); x.stroke();
            if (l) x.fillText(l, w - 70 - 110 * (labels.length - 1 - k), 18);
        });
    }
    async function poll() {
        try {
            const d = await (await fetch(`/api/poll?log=${logN}&seq=${seq}`)).json();
            if (d.log.length) { log.textContent += d.log.join('\n') + '\n'; logN += d.log.length; if (stick) log.scrollTop = log.scrollHeight }
            $('sstat').textContent = d.stress.running ? `running: ${d.stress.sent} sent` : (d.stress.sent ? `done: ${d.stress.sent} sent` : '');
            const dirty = new Set();
            for (const m of d.samples) {
                const key = m.ext + '/' + m.name;
                const e = series[key] ??= { ext: m.ext, name: m.name, traces: {}, total: null };
                const tr = e.traces[m.trace] ??= { t: [], v: [] }; tr.t.push(m.t); tr.v.push(m.value); nowT = Math.max(nowT, m.t);
                if (m.total != null) e.total = m.total; seq = m.seq + 1; dirty.add(e)
            }
            dirty.forEach(draw);
        } catch (e) { }
        setTimeout(poll, 300);
    }
    poll();
</script>
